query SystemSettings {
  system {
    settings {
      autoUpgrade {
        allowReboot
        enable
      }
      ssh {
        enable
      }
      timezone
    }
  }
}

query SystemIsUsingBinds {
  system {
    info {
      usingBinds
    }
  }
}

fragment fragmentDnsRecords on DnsRecord {
  recordType
  name
  displayName
  content
  ttl
  priority
}

query GetDnsRecords {
  system {
    domainInfo {
      domain
      hostname
      provider
      requiredDnsRecords {
        ...fragmentDnsRecords
      }
    }
  }
}

mutation ChangeTimezone($timezone: String!) {
  system {
    changeTimezone(timezone: $timezone) {
      ...basicMutationReturnFields
      timezone
    }
  }
}

mutation ChangeAutoUpgradeSettings($settings: AutoUpgradeSettingsInput!) {
  system {
    changeAutoUpgradeSettings(settings: $settings) {
      ...basicMutationReturnFields
      allowReboot
      enableAutoUpgrade
    }
  }
}

mutation ChangeSshSettings($settings: SSHSettingsInput!) {
  system {
    changeSshSettings(settings: $settings) {
      ...basicMutationReturnFields
      enable
    }
  }
}

fragment updateChannelFields on UpdateChannel {
  id
  updateUrl
  name
  description
}

query GetUpdateChannels {
  system {
    updates {
      currentChannel {
        ...updateChannelFields
      }
      channels {
        ...updateChannelFields
      }
    }
  }
}

mutation SetUpdateChannel($channelId: String!) {
  system {
    setUpdateChannel(channelId: $channelId) {
      ...basicMutationReturnFields
    }
  }
}

query GetCredentialPolicy {
  users { minimumCredentialType }
}

fragment telemetryFields on OpenTelemetrySettings {
  enable
  endpoint
  uploadSystemLogs
  uploadSystemMetrics
  headerNames
  memoryTracingEnabled
}

query GetTelemetrySettings {
  system {
    settings {
      openTelemetry { ...telemetryFields }
    }
  }
}

mutation SetTelemetrySettings($settings: OpenTelemetrySettingsInput!) {
  system {
    changeOpenTelemetrySettings(settings: $settings) {
      ...basicMutationReturnFields
      settings { ...telemetryFields }
    }
  }
}

mutation SetCredentialPolicy($policy: KanidmCredentialType!) {
  users {
    setKanidmMinimumCredentialType(minimumCredentialType: $policy) {
      ...basicMutationReturnFields
      minimumCredentialType
    }
  }
}
